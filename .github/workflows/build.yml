# Сборка трёх движков ФАН на бесплатных раннерах GitHub (публичный репозиторий).
# iOS: macOS-раннер, XcodeGen + xcodebuild без подписи → неподписанный IPA (ставится Sideloadly под Apple ID).
# Android собирается локально (publish-release.sh, постоянный ключ). Windows: portable .exe для проверки. Артефакты — во вкладке Actions у запуска.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test

  ios:
    runs-on: macos-latest
    needs: shim
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: mobile/ios
        run: xcodegen generate
      - name: Build (no signing)
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild -project FanDvizhok.xcodeproj -scheme FanDvizhok -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -60
      - name: Pack IPA
        working-directory: mobile/ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FanDvizhok.app Payload/
          zip -qr FanDvizhok-unsigned.ipa Payload
          ls -la FanDvizhok-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: mobile/ios/FanDvizhok-unsigned.ipa


  windows:
    runs-on: windows-latest
    needs: shim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Package portable exe
        working-directory: desktop
        run: npx electron-builder --win portable
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable-exe
          path: desktop/dist/*.exe
