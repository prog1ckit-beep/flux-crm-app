# Сборка трёх движков ФАН на бесплатных раннерах GitHub (публичный репозиторий).
# iOS: macOS-раннер, XcodeGen + xcodebuild без подписи → неподписанный IPA (ставится Sideloadly под Apple ID).
# Android: Ubuntu-раннер → debug APK. Windows: portable .exe. Артефакты — во вкладке Actions у запуска.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test

  ios:
    runs-on: macos-latest
    needs: shim
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: mobile/ios
        run: xcodegen generate
      - name: Build (no signing)
        working-directory: mobile/ios
        run: |
          xcodebuild -project FanDvizhok.xcodeproj -scheme FanDvizhok -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -60
      - name: Pack IPA
        working-directory: mobile/ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FanDvizhok.app Payload/
          zip -qr FanDvizhok-unsigned.ipa Payload
          ls -la FanDvizhok-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: mobile/ios/FanDvizhok-unsigned.ipa

  android:
    runs-on: ubuntu-latest
    needs: shim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.11.1 }
      - name: Build debug APK
        working-directory: mobile/android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    runs-on: windows-latest
    needs: shim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Package portable exe
        working-directory: desktop
        run: npx electron-builder --win portable
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable-exe
          path: desktop/dist/*.exe
