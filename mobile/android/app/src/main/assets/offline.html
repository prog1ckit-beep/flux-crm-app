<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ФАН — сервер недоступен</title>
<style>
  body{margin:0;background:#111318;color:#e8e8ee;font:16px/1.5 system-ui,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh}
  .box{max-width:420px;padding:24px;text-align:center} h1{font-size:22px;margin:0 0 8px} p{color:#8a8fa3;margin:0 0 18px;word-break:break-all}
  button{background:#ff4fa3;color:#fff;border:0;border-radius:8px;padding:12px 18px;font-size:16px;margin:4px} button.sec{background:#2a2e3b}
</style></head>
<body><div class="box">
  <h1>Сервер CRM недоступен</h1>
  <p id="info"></p>
  <button onclick="FanDevice.call('app.reload')">Повторить</button>
  <button class="sec" onclick="FanDevice.settings.open()">Настройки</button>
</div>
<script>var q=new URLSearchParams(location.search);document.getElementById('info').textContent=(q.get('url')||'')+(q.get('err')?' — '+q.get('err'):'');</script>
</body></html>
